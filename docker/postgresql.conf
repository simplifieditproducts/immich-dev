include_if_exists '/var/lib/postgresql/data/postgresql.conf'

shared_preload_libraries = 'vchord.so, vectors.so'
search_path = '"$user", public, vectors'

# Memory Configuration (optimized for 128GB RAM)
shared_buffers = 48GB
work_mem = 64MB
maintenance_work_mem = 4GB
effective_cache_size = 96GB

# WAL Configuration
max_wal_size = 20GB
min_wal_size = 4GB
wal_compression = on

# Connection and Worker Configuration (optimized for 32 CPU cores)
max_connections = 300
max_worker_processes = 32
max_parallel_workers = 24
max_parallel_workers_per_gather = 8
max_parallel_maintenance_workers = 8

# Autovacuum Configuration (aggressive for high CPU)
autovacuum_max_workers = 12
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 1000

# I/O and Performance (optimized for high concurrency)
effective_io_concurrency = 200
maintenance_io_concurrency = 200
random_page_cost = 1.2

include_if_exists '/var/lib/postgresql/data/postgresql.override.conf'
